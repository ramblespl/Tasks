<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Stylized calendar/task board card with airplane -->
  <g filter="url(#shadow)" transform="translate(64, 64)">
    <!-- Calendar base header -->
    <rect x="32" y="48" width="320" height="288" rx="36" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-width="8" />
    <path d="M32 112 L352 112" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
    
    <!-- Top hanger rings -->
    <rect x="96" y="24" width="24" height="48" rx="12" fill="#ffffff" />
    <rect x="264" y="24" width="24" height="48" rx="12" fill="#ffffff" />

    <!-- Center plane icon (matching app brand) -->
    <g transform="translate(192, 208) rotate(-45)">
      <path d="M0 -72 L24 48 L0 28 L-24 48 Z" fill="#ffffff" />
      <path d="M-56 0 L0 -24 L56 0 L0 -6 Z" fill="#ffffff" fill-opacity="0.9" />
      <path d="M-20 40 L0 24 L20 40 L0 34 Z" fill="#ffffff" />
    </g>

    <!-- Checkmark accent badge in bottom right -->
    <circle cx="304" cy="272" r="44" fill="#10b981" stroke="#ffffff" stroke-width="6" />
    <path d="M288 272 L300 284 L324 258" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
